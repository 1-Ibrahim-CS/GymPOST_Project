$kind: http-request
description: The class's trainer (or an admin) sees the bookings with a summary.
url: "{{baseUrl}}/classes/{{classId}}/bookings"
method: GET
headers:
  x-access-token: "{{trainerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test("Two active bookings", function () {
          pm.expect(json.count).to.eql(2);
          pm.expect(json.summary.booked).to.eql(2);
          pm.expect(json.class.booked_count).to.eql(2);
      });
    language: text/javascript
order: 8000
