$kind: http-request
description: The trainer adds a place.
url: "{{baseUrl}}/classes/{{classId}}"
method: PUT
headers:
  x-access-token: "{{trainerToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "capacity": 2
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test("One space left", function () { pm.expect(json.class.spaces_left).to.eql(1); });
    language: text/javascript
order: 5000
