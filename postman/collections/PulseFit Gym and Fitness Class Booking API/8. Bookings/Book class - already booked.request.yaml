$kind: http-request
description: A member cannot book the same class twice.
url: "{{baseUrl}}/classes/{{classId}}/bookings"
method: POST
headers:
  x-access-token: "{{memberToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Returns existing booking", function () { pm.expect(json.details.booking_id).to.eql(pm.collectionVariables.get("bookingId")); });
    language: text/javascript
order: 3000
