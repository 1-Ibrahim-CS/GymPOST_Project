$kind: http-request
description: The class has no active bookings, so it can be deleted.
url: "{{baseUrl}}/classes/{{classId}}"
method: DELETE
headers:
  x-access-token: "{{trainerToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 21000
