$kind: http-request
description: attended must be a boolean.
url: "{{baseUrl}}/classes/{{pastClassId}}/bookings/{{pastBookingId}}/attendance"
method: PUT
headers:
  x-access-token: "{{adminToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "attended": "yes"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 25000
