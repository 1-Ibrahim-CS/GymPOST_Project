$kind: http-request
description: Members can only cancel their own bookings.
url: "{{baseUrl}}/classes/{{classId}}/bookings/{{bookingId}}"
method: DELETE
headers:
  x-access-token: "{{otherMemberToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 13000
