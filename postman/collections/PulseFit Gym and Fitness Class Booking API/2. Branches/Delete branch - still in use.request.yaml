$kind: http-request
description: A branch with members, trainers or upcoming classes cannot be deleted.
url: "{{baseUrl}}/branches/{{branchId}}"
method: DELETE
headers:
  x-access-token: "{{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Lists what is linked", function () { pm.expect(json.details).to.include.keys("members", "trainers"); });
    language: text/javascript
order: 18000
