$kind: http-request
description: Members cannot create branches (admin only).
url: "{{baseUrl}}/branches"
method: POST
headers:
  x-access-token: "{{memberToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Not Allowed"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Explains the required role", function () { pm.expect(json.details.required_role).to.eql("admin"); });
    language: text/javascript
order: 12000
