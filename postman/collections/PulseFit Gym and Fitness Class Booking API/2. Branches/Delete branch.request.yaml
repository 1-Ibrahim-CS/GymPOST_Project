$kind: http-request
description: Deletes the unused branch created above.
url: "{{baseUrl}}/branches/{{newBranchId}}"
method: DELETE
headers:
  x-access-token: "{{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 19000
