$kind: http-request
description: At least one field must be sent.
url: "{{baseUrl}}/branches/{{newBranchId}}"
method: PUT
headers:
  x-access-token: "{{adminToken}}"
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 17000
