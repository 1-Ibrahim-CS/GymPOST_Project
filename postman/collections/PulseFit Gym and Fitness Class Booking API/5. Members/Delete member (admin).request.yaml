$kind: http-request
description: Deletes the member, their login account, their reviews, and frees their upcoming class places.
url: "{{baseUrl}}/members/{{adminMemberId}}"
method: DELETE
headers:
  x-access-token: "{{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 17000
