$kind: http-request
description: Emails are unique across members and accounts.
url: "{{baseUrl}}/members/{{memberId}}"
method: PUT
headers:
  x-access-token: "{{adminToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "postman2.{{runId}}@example.com"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 10000
