$kind: http-request
description: Admin creates a member record without a login account (e.g. at the front desk). Id stored in `adminMemberId`.
url: "{{baseUrl}}/members"
method: POST
headers:
  x-access-token: "{{adminToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "walkin.{{runId}}@example.com",
      "name": "Walk In",
      "gender": "Male",
      "age": 41,
      "home_branch_id": "{{branchId}}",
      "plan": "Monthly"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test("Created response has id, url and Location header", function () {
          pm.expect(json.id).to.match(/^[0-9a-f]{24}$/);
          pm.expect(json.url).to.include(json.id);
          pm.response.to.have.header("Location");
      });
      pm.collectionVariables.set("adminMemberId", json.id);
    language: text/javascript
order: 14000
