$kind: http-request
description: "Status rules: a class cannot be completed before it starts."
url: "{{baseUrl}}/classes/{{classId}}"
method: PUT
headers:
  x-access-token: "{{trainerToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "completed"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 13000
