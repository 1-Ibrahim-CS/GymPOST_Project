$kind: http-request
description: Boolean, enum and ObjectId checks on query parameters.
url: "{{baseUrl}}/classes?available=maybe&level=Pro&branch=123"
method: GET
queryParams:
  available: maybe
  level: Pro
  branch: "123"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Details", function () { pm.expect(json.details).to.include.keys("available", "level", "branch"); });
    language: text/javascript
order: 4000
