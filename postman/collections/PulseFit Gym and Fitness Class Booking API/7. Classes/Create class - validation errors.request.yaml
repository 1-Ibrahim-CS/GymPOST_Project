$kind: http-request
description: Start time must be in the future; capacity 1-100; category and level enums.
url: "{{baseUrl}}/classes"
method: POST
headers:
  x-access-token: "{{trainerToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman Mobility {{runId}}",
      "category": "Zumba",
      "branch_id": "{{branchId}}",
      "start_time": "2020-01-01T09:00:00Z",
      "duration_min": 45,
      "level": "All levels",
      "capacity": 0
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Details", function () { pm.expect(json.details).to.include.keys("capacity", "category"); });
    language: text/javascript
order: 8000
