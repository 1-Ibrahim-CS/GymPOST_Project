$kind: http-request
description: "Checked after the schema: the start time must be in the future."
url: "{{baseUrl}}/classes"
method: POST
headers:
  x-access-token: "{{trainerToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Postman Mobility {{runId}}",
      "category": "yoga",
      "branch_id": "{{branchId}}",
      "start_time": "2020-01-01T09:00:00Z",
      "duration_min": 45,
      "level": "All levels",
      "capacity": 1
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("start_time reported", function () { pm.expect(json.details.start_time).to.eql("Must be in the future"); });
    language: text/javascript
order: 9000
