$kind: http-request
description: Wrong password returns 401 with the same message as an unknown username.
url: "{{baseUrl}}/auth/login"
method: POST
auth:
  type: basic
  credentials:
    username: admin
    password: "{{wrongPassword}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Generic message", function () { pm.expect(json.error).to.eql("Invalid username or password"); });
    language: text/javascript
order: 3000
