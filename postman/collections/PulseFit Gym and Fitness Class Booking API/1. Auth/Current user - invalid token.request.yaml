$kind: http-request
description: A malformed or tampered token returns 401.
url: "{{baseUrl}}/auth/me"
method: GET
headers:
  x-access-token: not.a.valid-token
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Message", function () { pm.expect(json.error).to.eql("Token is invalid"); });
    language: text/javascript
order: 14000
