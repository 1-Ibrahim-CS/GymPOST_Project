$kind: http-request
description: Duplicate username or email returns 409 Conflict.
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "admin",
      "email": "admin@pulsefit.example.com",
      "password": "Password123!",
      "name": "Duplicate Admin",
      "gender": "Male",
      "age": 30,
      "home_branch_id": "{{branchId}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 409", function () {
          pm.response.to.have.status(409);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Both conflicts reported", function () {
          pm.expect(json.details).to.have.keys("username", "email");
      });
    language: text/javascript
order: 7000
