$kind: http-request
description: Protected routes return 401 when the x-access-token header is missing.
url: "{{baseUrl}}/auth/me"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401", function () {
          pm.response.to.have.status(401);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 13000
