$kind: http-request
description: For member accounts the response includes a summary of the member record.
url: "{{baseUrl}}/auth/me"
method: GET
headers:
  x-access-token: "{{memberToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test("Includes member summary with active membership", function () {
          pm.expect(json.member._id).to.eql(pm.collectionVariables.get("memberId"));
          pm.expect(json.member.membership.status).to.eql("active");
          pm.expect(json.member.membership.plan).to.eql("Quarterly");
      });
    language: text/javascript
order: 12000
