$kind: http-request
description: exercise_id must refer to an existing exercise.
url: "{{baseUrl}}/members/{{memberId}}/workouts"
method: POST
headers:
  x-access-token: "{{memberToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "date": "{{workoutDate}}",
      "workout_type": "strength",
      "duration_min": 55,
      "calories_burned": 480,
      "avg_bpm": 128,
      "max_bpm": 165,
      "exercises": [
        {
          "exercise_id": "000000000000000000000000",
          "sets": 3,
          "reps": 10
        }
      ]
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 3000
