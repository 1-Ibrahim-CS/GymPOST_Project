$kind: http-request
description: The workout is gone.
url: "{{baseUrl}}/members/{{memberId}}/workouts/{{workoutId}}"
method: GET
headers:
  x-access-token: "{{memberToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 16000
