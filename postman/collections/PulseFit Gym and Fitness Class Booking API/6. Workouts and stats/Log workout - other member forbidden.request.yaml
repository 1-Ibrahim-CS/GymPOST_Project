$kind: http-request
description: Members can only log their own workouts.
url: "{{baseUrl}}/members/{{otherMemberId}}/workouts"
method: POST
headers:
  x-access-token: "{{memberToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "date": "{{workoutDate}}",
      "workout_type": "strength",
      "duration_min": 55,
      "calories_burned": 480,
      "avg_bpm": 128,
      "max_bpm": 165,
      "exercises": [
        {
          "exercise_id": "{{exerciseId}}",
          "sets": 4,
          "reps": 8,
          "weight_kg": 30
        },
        {
          "exercise_id": "{{exerciseId}}",
          "sets": 3,
          "reps": 12,
          "weight_kg": null
        }
      ]
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 4000
