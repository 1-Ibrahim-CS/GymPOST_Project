$kind: http-request
description: Removes the workout sub-document ($pull).
url: "{{baseUrl}}/members/{{memberId}}/workouts/{{workoutId}}"
method: DELETE
headers:
  x-access-token: "{{memberToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 15000
