$kind: http-request
description: Enum check on sort.
url: "{{baseUrl}}/reports/popular-classes?sort=profit&from=2026-10-10&to=2026-01-01"
method: GET
headers:
  x-access-token: "{{adminToken}}"
queryParams:
  sort: profit
  from: 2026-10-10
  to: 2026-01-01
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 3000
