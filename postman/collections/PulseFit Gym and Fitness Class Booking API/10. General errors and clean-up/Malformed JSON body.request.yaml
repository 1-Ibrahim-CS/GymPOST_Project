$kind: http-request
description: A body that is not valid JSON is rejected.
url: "{{baseUrl}}/members/{{memberId}}"
method: PUT
headers:
  x-access-token: "{{memberToken}}"
  Content-Type: application/json
body:
  type: json
  content: '{"name": "Broken JSON",'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 3000
