$kind: http-request
description: Removes the member and their login account created by this run.
url: "{{baseUrl}}/members/{{memberId}}"
method: DELETE
headers:
  x-access-token: "{{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 8000
