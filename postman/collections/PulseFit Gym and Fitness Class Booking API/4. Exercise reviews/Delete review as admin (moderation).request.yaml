$kind: http-request
description: Admins can delete any review.
url: "{{baseUrl}}/exercises/{{exerciseId}}/reviews/{{reviewId}}"
method: DELETE
headers:
  x-access-token: "{{adminToken}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 204", function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 14000
