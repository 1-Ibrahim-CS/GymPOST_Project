$kind: http-request
description: Members cannot edit other members' reviews.
url: "{{baseUrl}}/exercises/{{exerciseId}}/reviews/{{reviewId}}"
method: PUT
headers:
  x-access-token: "{{otherMemberToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "stars": 1
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 403", function () {
          pm.response.to.have.status(403);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
    language: text/javascript
order: 9000
