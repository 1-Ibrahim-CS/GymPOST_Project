$kind: http-request
description: Adds a review sub-document. The duplicate check is part of the update filter, so it is atomic. Id stored in `reviewId`.
url: "{{baseUrl}}/exercises/{{exerciseId}}/reviews"
method: POST
headers:
  x-access-token: "{{memberToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "stars": 4,
      "comment": "Great shoulder builder, easy on the joints."
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      pm.test("Created response has id, url and Location header", function () {
          pm.expect(json.id).to.match(/^[0-9a-f]{24}$/);
          pm.expect(json.url).to.include(json.id);
          pm.response.to.have.header("Location");
      });
      pm.collectionVariables.set("reviewId", json.id);
    language: text/javascript
order: 3000
