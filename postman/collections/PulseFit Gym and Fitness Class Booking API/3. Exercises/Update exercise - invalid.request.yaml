$kind: http-request
description: Type checking on update.
url: "{{baseUrl}}/exercises/{{exerciseId}}"
method: PUT
headers:
  x-access-token: "{{adminToken}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rating": "very good"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("Type error", function () { pm.expect(json.details.rating).to.eql("Must be a number"); });
    language: text/javascript
order: 13000
