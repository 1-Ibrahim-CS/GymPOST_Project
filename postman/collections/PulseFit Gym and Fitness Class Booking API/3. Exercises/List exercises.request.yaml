$kind: http-request
description: Paginated list (alphabetical) with `review_count` and `avg_stars` computed by an aggregation pipeline.
url: "{{baseUrl}}/exercises"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      const json = pm.response.json();
      pm.test("Paginated with computed review fields", function () {
          pm.expect(json.pagination.total).to.be.above(200);
          pm.expect(json.data).to.have.lengthOf(10);
          pm.expect(json.data[0]).to.include.keys("review_count", "avg_stars");
          pm.expect(json.data[0]).to.not.have.property("reviews");
      });
    language: text/javascript
order: 1000
