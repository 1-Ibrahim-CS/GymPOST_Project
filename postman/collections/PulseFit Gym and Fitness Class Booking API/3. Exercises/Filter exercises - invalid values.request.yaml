$kind: http-request
description: Enum and range checks on query parameters.
url: "{{baseUrl}}/exercises?body_part=Wings&min_rating=12&sort=popularity"
method: GET
queryParams:
  body_part: Wings
  min_rating: "12"
  sort: popularity
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", function () {
          pm.response.to.have.status(400);
      });
      const json = pm.response.json();
      pm.test("Error response has an error message", function () {
          pm.expect(json.error).to.be.a("string").and.not.be.empty;
      });
      pm.test("All problems reported", function () { pm.expect(json.details).to.include.keys("body_part", "min_rating", "sort"); });
    language: text/javascript
order: 4000
